name: 编译安卓 APK（词库本）

# 每次推送代码后自动编译；也可以手动点 Run workflow 触发。
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # 固定 22.04，避免 latest 迁移到 Ubuntu 26 带来的环境变化
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      # 缓存 SDK/NDK：第二次之后从约 20 分钟降到约 5 分钟
      # 注意：不缓存 python-for-android 目录，避免把残缺的 p4a（无 origin remote）
      # 恢复进下次构建导致 git 检查失败。p4a 每次让 buildozer 全新 clone。
      - name: 缓存 SDK / NDK
        uses: actions/cache@v4
        with:
          path: |
            mobile/.buildozer/android/platform/android-sdk
            mobile/.buildozer/android/platform/android-ndk-*
          # v3：排除 p4a 目录，强制全新 clone，彻底规避残缺 p4a 反复作祟
          key: buildozer-v3-${{ runner.os }}-${{ hashFiles('mobile/buildozer.spec') }}

      # 用 Kivy 官方 Docker 镜像编译，绕开第三方 buildozer-action 的 chown 权限 bug。
      # 镜像内已备齐 Python / Cython / JDK / Android SDK，首次需联网下载 SDK/NDK。
      # 关键：官方镜像把项目挂到 /home/user/hostcwd，工作目录也是它——不是 /src。
      # 入口脚本会读取该目录属主并切成该用户运行，所以不会触发 root 确认。
      # 编译偶发会因网络抖动失败，故失败后自动重试一次；完整日志存文件便于排错。
      - name: 编译 APK（补装 SDK platform + 失败自动重试一次）
        working-directory: mobile
        run: |
          echo "开始编译，首次约 20 分钟，请耐心等待..."
          df -h . | tail -1
          set +e
          ok=0
          for attempt in 1 2; do
            echo "===== 第 $attempt 次编译尝试 ====="
            # 用 --entrypoint bash 直接跑构建脚本：脚本会先补装 Android platform 再编译，
            # 绕开新版 p4a "Available Android APIs are ()" 的上游 bug。
            docker run --rm -i -v "$PWD:/home/user/hostcwd" \
              --entrypoint bash kivy/buildozer:latest \
              /home/user/hostcwd/build_android.sh 2>&1 | tee "build_log_$attempt.txt"
            rc=${PIPESTATUS[0]}
            echo "本次编译退出码: $rc"
            if [ "$rc" = "0" ]; then
              ok=1
              break
            fi
            if [ "$attempt" = "1" ]; then
              echo "第一次失败，5 秒后自动重试一次..."
              sleep 5
            fi
          done
          if [ "$ok" != "1" ]; then
            echo "两次编译均失败。请到本任务底部 Artifacts 下载「编译日志」，把里面的 build_log_2.txt 发给开发者排错。"
            exit 1
          fi
          echo "编译成功"

      # 容器内 root 生成的文件，改回当前用户可读
      - name: 修正产物权限
        if: always()
        run: sudo chown -R "$USER:$USER" mobile/bin mobile/.buildozer 2>/dev/null || true

      # 无论成败都上传完整编译日志，失败时可直接下载发给开发者，无需截图
      - name: 上传编译日志（排错用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 编译日志
          path: mobile/build_log_*.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: 词库本-APK
          path: mobile/bin/*.apk
          if-no-files-found: error
          retention-days: 90
