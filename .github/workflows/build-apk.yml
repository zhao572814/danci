name: 编译安卓 APK（词库本）

# 每次推送代码后自动编译；也可以手动点 Run workflow 触发。
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # 固定 22.04，避免 latest 迁移到 Ubuntu 26 带来的环境变化
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      # 缓存 SDK/NDK：第二次之后从约 20 分钟降到约 5 分钟
      - name: 缓存 SDK / NDK
        uses: actions/cache@v4
        with:
          path: mobile/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('mobile/buildozer.spec') }}

      # 用 Kivy 官方 Docker 镜像编译，绕开第三方 buildozer-action 的 chown 权限 bug。
      # 镜像内已备齐 Python / Cython / JDK / Android SDK，首次需联网下载 SDK/NDK。
      - name: 编译 APK（Kivy 官方镜像）
        working-directory: mobile
        run: |
          echo "开始编译，首次约 20 分钟，请耐心等待..."
          df -h . | tail -1
          docker run --rm -v "$PWD:/src" kivy/buildozer:latest android debug

      # 容器内 root 生成的文件，改回当前用户可读
      - name: 修正产物权限
        if: always()
        run: sudo chown -R "$USER:$USER" mobile/bin mobile/.buildozer 2>/dev/null || true

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: 词库本-APK
          path: mobile/bin/*.apk
          if-no-files-found: error
          retention-days: 90
